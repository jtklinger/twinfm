[package]
name = "rustfm-proto"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One-week prototype: Rust + Slint dual-pane file manager for Windows 11"

[dependencies]
# Slint master a1ce0d8 plus the two accessibility patches in docs/patches/, carried on the
# `rustfm` branch of the jtklinger/slint fork and pinned by rev (never by branch).
slint = { git = "https://github.com/jtklinger/slint", rev = "c1d3a8d0aa2d61d72da6c11501060eb1650674b6", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2"] }
crossbeam-channel = "0.5"
windows-sys = { version = "0.60", features = ["Win32_System_Threading", "Win32_Foundation"] }

[features]
# Default build matches slint's defaults. `cargo build --release --no-default-features` builds the
# accessibility-off variant used to isolate the AccessKit cost (see PROTOTYPE-RESULT.md).
default = ["accessibility"]
accessibility = ["slint/accessibility"]
# Day-5 renderer check: `cargo build --release --features skia --target-dir target-skia`, then run with
# SLINT_BACKEND=winit-skia (Direct3D on Windows) or winit-femtovg to compare in one binary.
skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = { git = "https://github.com/jtklinger/slint", rev = "c1d3a8d0aa2d61d72da6c11501060eb1650674b6" }

[profile.release]
debug = 1


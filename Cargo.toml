[package]
name = "twinfm"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "TwinFM: a dual-pane file manager for Windows 11 in Rust and Slint, built to stay smooth on very large folders"

[dependencies]
# Slint master a1ce0d8 plus the two accessibility patches in docs/patches/, carried on the
# `rustfm` branch of the jtklinger/slint fork and pinned by rev (never by branch).
slint = { git = "https://github.com/jtklinger/slint", rev = "c1d3a8d0aa2d61d72da6c11501060eb1650674b6", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2", "raw-window-handle-06"] }
crossbeam-channel = "0.5"
# Reads zip central directories for archive listings (P3-M4) and writes zips (P7-M3: entries
# copied raw, new ones deflated with zlib-rs, pure Rust; `unreserved` lets a raw copy keep the
# extra fields other zippers write, such as Info-ZIP's Unix 0x7875); MIT. The shell extracts.
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs", "unreserved", "aes-crypto"] }
# Compress to > TAR file (P7-M3); MIT/Apache-2.0, no xattr.
tar = { version = "=0.4.46", default-features = false }
# Compress to > 7z file (P7-M3): LZMA2 in pure Rust; Apache-2.0; no encryption, bzip2 or ppmd.
sevenz-rust2 = { version = "=0.24.1", default-features = false, features = ["compress"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
raw-window-handle = "0.6"
windows-sys = { version = "0.60", features = ["Win32_System_Threading", "Win32_System_Time", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Storage_CloudFilters", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_Debug", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Com_Marshal", "Win32_Globalization", "Win32_System_SystemServices", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry", "Win32_System_IO", "Win32_Storage_Packaging_Appx", "Win32_Graphics_Dwm", "Win32_System_Variant"] }
# Reads the packaged apps' AppxManifest.xml for their context menu commands (P7-M2); MIT/Apache-2.0,
# no dependencies of its own.
roxmltree = { version = "=0.21.1", default-features = false, features = ["std"] }
# Renders PDF pages for the preview pane (P8-M1), pure Rust; MIT OR Apache-2.0. Its default
# features keep the substitute fonts for the 14 standard PDF fonts and the CMaps.
hayro = "=0.8.0"
# Markdown in the preview pane (P8-M2): the parser and the image decoders, all the copies Slint
# already builds (pulldown-cmark for StyledText, image and resvg for its images), so nothing new is
# compiled; image gains its gif and webp features (the gif and image-webp crates resvg already
# brings). pulldown-cmark MIT; image MIT OR Apache-2.0; resvg Apache-2.0 OR MIT. Pictures in the
# preview (P9-M2): bmp and ico add no crate; tiff adds tiff 0.11.3 and fax 0.2.7, both MIT. HTML is
# read by TwinFM's own scanner (src/html.rs), no crate.
pulldown-cmark = { version = "=0.13.4", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
resvg = { version = "=0.48.1", default-features = false }
# Word, Excel and PowerPoint in the preview (P9-M3): their XML parts read as a stream, so reading
# stops at a cap with what it has. MIT. The copy Slint's winit backend already locks (0.41.0), so the
# lock gains an edge, no crate.
quick-xml = { version = "=0.41.0", default-features = false }

[features]
# Default build matches slint's defaults. `cargo build --release --no-default-features` builds the
# accessibility-off variant used to isolate the AccessKit cost (see PROTOTYPE-RESULT.md).
default = ["accessibility"]
accessibility = ["slint/accessibility"]
# Day-5 renderer check: `cargo build --release --features skia --target-dir target-skia`, then run with
# SLINT_BACKEND=winit-skia (Direct3D on Windows) or winit-femtovg to compare in one binary.
skia = ["slint/renderer-skia"]

[build-dependencies]
slint-build = { git = "https://github.com/jtklinger/slint", rev = "c1d3a8d0aa2d61d72da6c11501060eb1650674b6" }

# Embeds assets/icon/twinfm.ico as the exe's icon (MIT; a build tool, not in the binary).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[profile.release]
debug = 1


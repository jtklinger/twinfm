[package]
name = "rustfm-proto"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "One-week prototype: Rust + Slint dual-pane file manager for Windows 11"

[dependencies]
slint = { git = "https://github.com/slint-ui/slint", branch = "master", default-features = false, features = ["std", "backend-default", "renderer-femtovg", "renderer-software", "compat-1-2"] }
crossbeam-channel = "0.5"
windows-sys = { version = "0.60", features = ["Win32_System_Threading", "Win32_Foundation"] }

[features]
# Default build matches slint's defaults. `cargo build --release --no-default-features` builds the
# accessibility-off variant used to isolate the AccessKit cost (see PROTOTYPE-RESULT.md).
default = ["accessibility"]
accessibility = ["slint/accessibility"]

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", branch = "master" }

[profile.release]
debug = 1

# Day-2 experiment: Slint master with the accessibility update coalescing patch
# (vendor/slint, ignored by git; the diff is docs/patches/accesskit-coalesce.diff).
[patch."https://github.com/slint-ui/slint"]
slint = { path = "vendor/slint/api/rs/slint" }
slint-build = { path = "vendor/slint/api/rs/build" }
i-slint-backend-winit = { path = "vendor/slint/internal/backends/winit" }
